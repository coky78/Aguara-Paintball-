```html
<!DOCTYPE html>
<html lang="es">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <title>Aguará — Administración</title>

  <link rel="stylesheet" href="style.css">

  <style>

    /* =========================
       LOGIN
    ========================= */

    #login-screen {
      position: fixed;
      inset: 0;
      z-index: 99999;

      display: flex;
      align-items: center;
      justify-content: center;

      background: #080808;

      padding: 20px;
    }

    .login-box {
      width: min(400px, 100%);

      padding: 35px;

      border: 1px solid #333;
      border-radius: 14px;

      background: #111;

      text-align: center;

      box-shadow:
        0 20px 60px rgba(0,0,0,.7);
    }

    .login-box h2 {
      margin-bottom: 8px;
    }

    .login-box p {
      margin-bottom: 22px;
    }

    .login-box input {
      display: block;

      width: 100%;

      box-sizing: border-box;

      margin: 12px 0;

      padding: 14px;

      border: 1px solid #444;
      border-radius: 8px;

      background: #1b1b1b;

      color: #fff;

      font-size: 16px;
    }

    .login-box button {
      width: 100%;

      margin-top: 10px;

      padding: 14px;

      border: 0;

      border-radius: 8px;

      cursor: pointer;

      font-weight: bold;

      font-size: 16px;
    }

    #login-error {
      min-height: 20px;

      margin-top: 15px;

      color: #ff5555;
    }


    /* =========================
       PANEL
    ========================= */

    #admin-panel {
      display: none;
    }

  </style>

</head>


<body>


  <!-- =========================
       LOGIN
  ========================= -->

  <div id="login-screen">

    <div class="login-box">

      <h2>Aguará Paintball</h2>

      <p>
        Panel de administración
      </p>


      <input
        id="admin-user"
        name="admin_username"
        type="text"

        autocomplete="off"
        autocapitalize="none"
        autocorrect="off"
        spellcheck="false"

        placeholder="Usuario"
      >


      <input
        id="admin-pass"
        name="admin_password"
        type="password"

        autocomplete="new-password"
        autocapitalize="none"
        autocorrect="off"
        spellcheck="false"

        placeholder="Contraseña"
      >


      <button
        id="login-btn"
        type="button"
      >
        INGRESAR
      </button>


      <p id="login-error"></p>

    </div>

  </div>



  <!-- =========================
       CABECERA
  ========================= -->

  <header class="nav">

    <a
      class="brand"
      href="index.html"
    >

      <span>
        Aguará <b>Paintball</b>
      </span>

    </a>


    <a
      class="btn btn-outline"
      href="index.html"
    >
      ← Volver al sitio
    </a>

  </header>



  <!-- =========================
       PANEL
  ========================= -->

  <main
    class="section"
    style="padding-top:120px"
  >

    <div id="admin-panel">


      <p class="eyebrow">
        PANEL DE ADMINISTRACIÓN
      </p>


      <h1>
        Configuración y reservas
      </h1>



      <div class="booking-layout">


        <!-- =========================
             PRECIOS
        ========================= -->

        <section class="booking-card">

          <h2>
            Precios y reglas
          </h2>


          <form
            id="configForm"
            class="form-grid"
          >


            <!-- PAINTBALL -->

            <label>

              Precio del juego por jugador

              <input
                id="gamePrice"
                type="number"
                min="0"
              >

            </label>


            <label>

              Texto de munición — Paintball

              <input
                id="shotsText"
                type="text"
                value="100 TIROS INCLUIDOS"
              >

            </label>



            <!-- HIDROGEL -->

            <label>

              Precio por jugador — Hidrogel

              <input
                id="hydrogelPrice"
                type="number"
                min="0"
                value="0"
              >

            </label>


            <label>

              Texto de munición — Hidrogel

              <input
                id="hydrogelShotsText"
                type="text"
                value="MUNICIÓN INCLUIDA"
              >

            </label>



            <!-- SEÑA -->

            <label>

              Seña

              <input
                id="deposit"
                type="number"
                min="0"
              >

            </label>



            <!-- MÍNIMO -->

            <label>

              Mínimo de jugadores

              <input
                id="minPlayers"
                type="number"
                min="1"
              >

            </label>



            <!-- WHATSAPP -->

            <label>

              WhatsApp del negocio

              <input
                id="whatsapp"
                type="tel"
                inputmode="numeric"
                placeholder="549379..."
              >

            </label>



            <!-- HORARIOS -->

            <label>

              Horarios (separados por coma)

              <textarea
                id="slots"
                rows="4"
              ></textarea>

            </label>



            <!-- GUARDAR -->

            <button
              class="btn btn-primary full"
              type="submit"
            >

              Guardar configuración

            </button>


          </form>



          <div
            id="saved"
            class="form-message"
            hidden
          >

            Configuración guardada.

          </div>


        </section>



        <!-- =========================
             RESERVAS
        ========================= -->

        <section class="booking-card">

          <h2>
            Reservas
          </h2>


          <div id="bookings"></div>


        </section>


      </div>


    </div>

  </main>



  <!-- =========================
       ADMIN.JS
  ========================= -->

  <script src="admin.js"></script>



  <!-- =========================
       LOGIN
  ========================= -->

  <script>

    const loginScreen =
      document.getElementById(
        "login-screen"
      );


    const adminPanel =
      document.getElementById(
        "admin-panel"
      );


    const loginBtn =
      document.getElementById(
        "login-btn"
      );


    const loginError =
      document.getElementById(
        "login-error"
      );


    const userInput =
      document.getElementById(
        "admin-user"
      );


    const passInput =
      document.getElementById(
        "admin-pass"
      );



    /* =========================
       LOGIN
    ========================= */

    async function login() {

      const username =
        userInput.value.trim();


      const password =
        passInput.value;


      loginError.textContent = "";



      if (!username || !password) {

        loginError.textContent =
          "Ingresá usuario y contraseña.";

        return;

      }



      loginBtn.disabled = true;

      loginBtn.textContent =
        "VERIFICANDO...";



      try {

        const response =
          await fetch(
            "/api/admin-login",
            {
              method: "POST",

              headers: {
                "Content-Type":
                  "application/json"
              },

              body: JSON.stringify({
                username: username,
                password: password
              })
            }
          );


        const data =
          await response.json();



        if (data.ok) {

          loginScreen.style.display =
            "none";


          adminPanel.style.display =
            "block";


          userInput.value = "";
          passInput.value = "";


        } else {

          loginError.textContent =
            data.message ||
            "Usuario o contraseña incorrectos.";

        }


      } catch (error) {

        console.error(error);


        loginError.textContent =
          "No se pudo conectar con el servidor.";

      }


      loginBtn.disabled = false;

      loginBtn.textContent =
        "INGRESAR";

    }



    /* =========================
       BOTÓN LOGIN
    ========================= */

    loginBtn.addEventListener(
      "click",
      login
    );



    /* =========================
       ENTER
    ========================= */

    passInput.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {

          event.preventDefault();

          login();

        }

      }
    );

  </script>


</body>

</html>
```
